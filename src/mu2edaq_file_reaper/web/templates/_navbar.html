<nav class="navbar navbar-expand-lg navbar-dark bg-dark {% if not dry_run %}mb-4{% endif %}">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('views.index') }}">
      <i class="bi bi-scissors"></i> mu2edaq File Reaper
      {% if label %}<span class="badge bg-secondary ms-1 fw-normal">{{ label }}</span>{% endif %}
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#nav-links" aria-controls="nav-links"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav-links">
      <ul class="navbar-nav me-auto">
        {% for endpoint, nav_label, icon in nav_items %}
        <li class="nav-item">
          <a class="nav-link{% if request.endpoint == endpoint or (endpoint == 'views.index' and request.endpoint == 'views.area') %} active{% endif %}"
             href="{{ url_for(endpoint) }}">
            <i class="bi {{ icon }}"></i> {{ nav_label }}
          </a>
        </li>
        {% endfor %}
      </ul>
      <ul class="navbar-nav ms-auto align-items-center gap-3">
        <li class="nav-item">
          <span class="navbar-text small text-secondary" id="last-update"></span>
        </li>
        {% if is_admin %}
        <li class="nav-item">
          <span class="badge badge-admin" title="Admin session: mutating controls are unlocked">ADMIN</span>
        </li>
        <li class="nav-item">
          <form method="post" action="{{ url_for('views.logout') }}" class="d-inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn-sm btn-outline-light">
              <i class="bi bi-box-arrow-right"></i> Sign out
            </button>
          </form>
        </li>
        {% else %}
        <li class="nav-item">
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('views.login', next=(request.full_path.rstrip('?') if request.endpoint != 'views.login' else None)) }}">
            <i class="bi bi-person-lock"></i> Admin: sign in
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
