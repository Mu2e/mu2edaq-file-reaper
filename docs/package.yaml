interactions:
  depends_on:
    - package: mu2edaq-fts
      via: sqlite-read
      direction: out
      evidence: "src/mu2edaq_file_reaper/fts_gate.py:56"
      note: "files table, mode=ro, status IN (COMPLETED, DELETED), path match only; delete gate"
    - package: mu2edaq-discovery
      via: import
      direction: out
      optional: true
      evidence: "src/mu2edaq_file_reaper/discovery.py:21"
      note: "Responder app=file-reaper, all meta values str; CLI discover() at src/mu2edaq_reaper_cli/config.py:201"
    - package: mu2edaq-phone-notification-system
      via: import
      direction: out
      optional: true
      evidence: "src/mu2edaq_file_reaper/notify/channels.py:65"
      note: "mu2edaq_notify.NotifyPublisher"
    - package: mu2edaq-phone-notification-system
      via: http
      direction: out
      evidence: "src/mu2edaq_file_reaper/notify/channels.py:79"
      note: "POST <url>/api/events; server port 8095 is the server's own config; URL from config, MU2EDAQ_NOTIFY_URL or discovery app=notify"
    - package: mu2edaq-dashboard
      via: zmq
      direction: out
      evidence: "src/mu2edaq_file_reaper/notify/channels.py:107"
      note: "PUSH connect tcp://host:5555 (channels.py:111) to the dashboard's PULL bind; SNDTIMEO 1000, SNDHWM 100, no IMMEDIATE"
    - package: mu2edaq-bigredbox
      via: udp
      direction: out
      evidence: "src/mu2edaq_file_reaper/notify/channels.py:160"
      note: "broadcast 255.255.255.255:37020, off by default; prefers daq_alert.send_alert (channels.py:149), whose call is broken (FR-011)"
  depended_on_by: []
  external: [smtp, slack-webhook, mail]

quality:
  tests: {present: true, framework: pytest, count: 199}
  ci: {present: false, workflows: []}
  license: MIT
  artifacts_clean: true

