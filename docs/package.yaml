schema: mega-review/1
package: mu2edaq-file-reaper
tier: A
group: data-movement
repo:
  url: git@github.com:Mu2e/mu2edaq-file-reaper.git
  exists: true
  issues_enabled: true
doc_dir: docs
summary: >
  Policy-driven disk cleanup daemon that measures configured DAQ disk areas, alarms at
  warning/critical/full tiers, and compresses or deletes files in LRU or age order (raw
  data gated on mu2edaq-fts transfer status) down to a low-water mark, with an audit
  history, web UI, REST API and CLI
languages: [python, bash, powershell]
loc: 9980                      # tracked *.py including tests; shell and PowerShell not counted

runtime:
  executables:
    - name: mu2edaq-file-reaper
      kind: daemon
      man_page: man/man1/mu2edaq-file-reaper.1
      note: "console script, pyproject.toml [project.scripts]; also python -m mu2edaq_file_reaper"
    - name: file_reaper.py
      kind: daemon
      man_page: man/man1/mu2edaq-file-reaper.1
      note: "entry-point shim the start script execs (start-mu2edaq-file-reaper.sh:92)"
    - name: mu2edaq-reaper
      kind: cli
      man_page: man/man1/mu2edaq-reaper.1
    - name: start-mu2edaq-file-reaper.sh
      kind: script
      man_page: man/man1/mu2edaq-file-reaper-start.1
    - name: stop-mu2edaq-file-reaper.sh
      kind: script
      man_page: man/man1/mu2edaq-file-reaper-stop.1
    - name: bootstrap.sh
      kind: script
      man_page: man/man1/mu2edaq-file-reaper-bootstrap.1
    - name: bootstrap.ps1
      kind: script
      man_page: man/man1/mu2edaq-file-reaper-bootstrap.1
    - name: tools/make_demo_tree.py
      kind: script
      man_page: man/man1/make_demo_tree.1
    - name: mu2edaq_file_reaper
      kind: library
      man_page: man/man3/mu2edaq_file_reaper.3
      note: "Python package; mu2edaq_reaper_cli (client library) is covered by the same page"
    - name: start_file_reaper.sh
      kind: script
      waiver: "git symlink (mode 120000) to start-mu2edaq-file-reaper.sh; covered by that page"
    - name: stop_file_reaper.sh
      kind: script
      waiver: "git symlink (mode 120000) to stop-mu2edaq-file-reaper.sh; covered by that page"
    - name: start-mu2edaq-file-reaper.ps1
      kind: script
      waiver: "Windows foreground launcher; no man page (FR-016 k)"
    - name: stop-mu2edaq-file-reaper.ps1
      kind: script
      waiver: "Windows stop script; no man page (FR-016 k)"
    - name: lib/file-reaper-proc.sh
      kind: library
      waiver: "sourced by the start and stop scripts, never executed; described in README 'Start and stop'"
  services: []
  ports:
    - {port: 5004, proto: tcp, role: web-ui-and-api, source: "start-mu2edaq-file-reaper.sh:20"}
    - {port: 5004, proto: tcp, role: web-ui-code-default, source: "src/mu2edaq_file_reaper/settings.py:73"}
    - {port: 5004, proto: tcp, role: web-ui-config, source: "config/mu2edaq-file-reaper.yaml:18"}
    - {port: 28999, proto: udp, role: discovery-responder, source: "src/mu2edaq_file_reaper/discovery.py:30"}
  config_files:
    - config/mu2edaq-file-reaper.yaml
    - config/mu2e-file-reaper-dl-01.yaml
    - config/mu2edaq-file-reaper-test.yaml
    - config/sandbox.yaml
    - config/.env.example
  env_vars:
