notes:
  dedup: >
    gh issue list -R Mu2e/mu2edaq-file-reaper --state all returned 0 issues on
    2026-10-06; no fingerprint or title-token match was possible. FR-001 and FR-002
    are the reaper side of mu2edaq-fts FTS-002 (b6517e10) and FTS-001/FTS-004
    (b36928f6, a9628446). Filed separately on purpose: the fixes are independent
    changes in different repositories and each closes half of the hazard.
  no_s1: >
    No S1. Every write path has a dry-run guard (actions.py:160-162, 241-244;
    reaper.py:342, 520); the FTS gate fails closed on any sqlite3.Error
    (fts_gate.py:46-72, reaper.py:411-420); actions re-verify parent and file
    identity by descriptor before unlinkat (actions.py:96-170); every mutating API
    route requires operate or admin scope, and session mutations require CSRF
    (web/auth.py:116-135). The S2s are ways the gate or an operator exclusion can
    be satisfied by the wrong file.
  fts_contract: >
    Table, columns (filepath, compressed_path, status) and status spellings agree
    with mu2edaq-fts/docs/INTERFACES.md. Two statements there are slightly off for
    the reaper side: an already-absent file is a 'vanished' skip, not a success
    (actions.py:122-123); filepath is absolute only if fts's source_directory is
    (fts/config.py:163). Recorded in docs/ISSUES-PENDING.md for the orchestrator.
  tests_run: >
    199 collected (pytest --co). Not re-run in this session: FR-015 documents that
    running the suite with the checkout as working directory kills the launching
    shell, including the CMake pytest target (CMakeLists.txt:30-37). The previous
    review pass recorded 199/199 passing when launched from another directory.
